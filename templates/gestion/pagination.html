{% if is_paginated %}
<nav class="pager" aria-label="Pagination">
    {% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Précédent</a>{% endif %}
    <span>Page {{ page_obj.number }} sur {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Suivant</a>{% endif %}
</nav>
{% endif %}
