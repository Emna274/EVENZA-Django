{% for message in messages %}
<div class="alert message {% if message.level_tag == 'error' %}alert-danger{% else %}alert-{{ message.level_tag }}{% endif %}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
    <i class="bi bi-{% if message.level_tag == 'error' %}exclamation-circle{% elif message.level_tag == 'success' %}check-circle{% else %}info-circle{% endif %}" aria-hidden="true"></i><span>{{ message }}</span>
</div>
{% endfor %}
