{% extends 'base.html' %}
{% block guest_content %}<header class="auth-heading"><span class="auth-icon"><i class="bi bi-envelope-check" aria-hidden="true"></i></span><h1>{{ title }}</h1></header>{% if description %}<p class="muted">{{ description }}</p>{% endif %}<a class="btn btn-primary" href="{% url 'login' %}">Retour à la connexion</a>{% endblock %}
{% block content %}<header class="page-heading"><div><h1>{{ title }}</h1>{% if description %}<p>{{ description }}</p>{% endif %}</div><a class="btn btn-primary" href="{% url 'profile' %}">Paramètres</a></header>{% endblock %}
